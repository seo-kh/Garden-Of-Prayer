<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중보의 정원 - 아이패드 입력</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/ipad.css">
</head>
<body>
  <div id="app-ipad">
    <!-- 상단 헤더 & 프로그래스 -->
    <header class="ipad-header">
      <div class="step-indicator">
        <div class="step-item active" id="indicator-1">1. 꽃 그리기</div>
        <div class="step-item" id="indicator-2">2. 이름 입력</div>
        <div class="step-item" id="indicator-3">3. 정원 배치</div>
      </div>
    </header>

    <!-- Step 1: Canvas (꽃 그리기) -->
    <main class="step-container active" id="step-canvas">
      <div class="canvas-layout">
        <div class="canvas-viewport">
          <p class="canvas-instruction">
            중보 대상을 생각하며, 중보의 정원에 심고싶은 꽃을 그려주세요.
          </p>
          <canvas id="flower-canvas" width="400" height="600"></canvas>
        </div>
        <div class="canvas-toolbar">
          <div>
            <div class="toolbar-group-title">브러시 굵기</div>
            <div class="size-picker">
              <input type="range" id="brush-size" min="4" max="40" value="16">
              <span id="brush-size-val" style="color: var(--primary-gold); font-weight: bold;">16px</span>
            </div>
          </div>

          <div>
            <div class="toolbar-group-title">색상 선택</div>
            <div class="color-palette">
              <!-- 검은색 제외 기본 팔레트 -->
              <button class="color-btn active" style="background-color: #ff4757;" data-color="#ff4757"></button>
              <button class="color-btn" style="background-color: #ffa502;" data-color="#ffa502"></button>
              <button class="color-btn" style="background-color: #eccc68;" data-color="#eccc68"></button>
              <button class="color-btn" style="background-color: #2ed573;" data-color="#2ed573"></button>
              <button class="color-btn" style="background-color: #1e90ff;" data-color="#1e90ff"></button>
              <button class="color-btn" style="background-color: #3742fa;" data-color="#3742fa"></button>
              <button class="color-btn" style="background-color: #a55eea;" data-color="#a55eea"></button>
              <label class="color-btn color-picker-icon-btn" id="custom-color-btn" for="native-color-picker" title="더많은 색상">
                🎨
                <input type="color" id="native-color-picker" value="#ff4757" style="position: absolute; opacity: 0; width: 0; height: 0;">
              </label>
            </div>
          </div>

          <div>
            <div class="toolbar-group-title">도구 모드</div>
            <div class="mode-switch">
              <button class="mode-btn active" id="tool-pen">펜</button>
              <button class="mode-btn" id="tool-eraser">지우개</button>
            </div>

            <div class="nav-bar" style="margin-top: 30px;">
              <button class="btn btn-danger" id="btn-clear-canvas">초기화</button>
              <button class="btn btn-primary" id="btn-to-step2">다음 단계</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Step 2: Form (이름 입력) -->
    <main class="step-container" id="step-form">
      <div class="form-card">
        <h2 class="form-title">중보할 사람 이름</h2>
        <p class="form-subtitle">정원에 심을 소중한 사람의 이름을 적어주세요.</p>
        
        <div class="form-input-group">
          <label class="form-label" for="owner-name">이름</label>
          <input type="text" id="owner-name" class="form-input" placeholder="예: 우리 엄마" maxlength="20">
        </div>

        <div class="nav-bar">
          <button class="btn" id="btn-back-to-step1">이전</button>
          <button class="btn btn-primary" id="btn-to-step3">다음</button>
        </div>
      </div>
    </main>

    <!-- Step 3: Layout (꽃 위치 및 2앵커 설정) -->
    <main class="step-container" id="step-layout">
      <div class="canvas-layout">
        <!-- 미니 정원 뷰포트 (배경 이미지/그래디언트 + 기존 모든 꽃 + 본인 꽃 드래그) -->
        <div class="layout-viewport fallback-gradient-bg" id="layout-garden-viewport">
          <!-- 안내 문구 영역-->
          <p class="user-flower-instruction">
            정원 위 꽃을 손가락으로 드래그하여 원하시는 위치에 올릴 수 있습니다.
          </p>

          <!-- 기존 꽃들이 렌더링될 레이어 -->
          <div id="existing-flowers-layer" style="position: absolute; width: 100%; height: 100%;"></div>

          <!-- 새로 작성 중인 본인의 꽃 드래그 엘리먼트 -->
          <div class="user-flower-item" id="user-flower-drag" style="top: 50%; left: 50%;">
            <img id="user-flower-img" src="" alt="나의 꽃">
            <div class="name-tag anchor-top" id="user-name-tag">이름</div>
          </div>
        </div>

        <!-- 우측 앵커 선택 패널 -->
        <div class="layout-sidebar">
          <div>
            <div class="toolbar-group-title">이름 위치</div>
            <p style="font-size: 16px; color: var(--text-muted); margin-bottom: 20px;">
              이름이 표시될 위치를 선택해주세요.
            </p>
            <div class="anchor-grid-1x2">
              <div class="anchor-cell active" data-anchor="top" title="상단">상단<div class="anchor-dot"></div></div>
              <div class="anchor-cell" data-anchor="bottom" title="하단">하단<div class="anchor-dot"></div></div>
            </div>
          </div>

          <div style="margin-top: 12px;">
            <div class="nav-bar">
              <button class="btn btn-primary btn-full" id="btn-open-confirm">정원에 심기</button>
            </div>
          </div>
          <div style="margin-top: auto;">
              <button class="btn" id="btn-back-to-step2">이전</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Confirm 전송 확인 모달 -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-card">
        <h3 class="modal-title">정원에 피워내기</h3>
        <p class="modal-desc">
          작성하신 꽃과 이름을 정원으로 전송하시겠습니까?<br>전송 후 프로젝터 화면에 피어나게 됩니다.
        </p>
        <div class="modal-actions">
          <button class="btn" id="btn-cancel-send">취소</button>
          <button class="btn btn-primary" id="btn-submit-flower">확인🚀</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/ipad/ipad.js"></script>
</body>
</html>
