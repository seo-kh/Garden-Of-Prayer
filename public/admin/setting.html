<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중보의 정원 (Admin)</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/ipad.css">
</head>

<body>
    <div id="app-admin">
        <!-- 헤더 -->
        <header class="admin-header">
            <div class="admin-title">
                <a href="/admin" style="color: var(--primary-gold); text-decoration: none;">뒤로가기</a>
            </div>
            <div>
                <button class="btn btn-primary" id="btn-publish-scene">
                    게시하기
                </button>
            </div>
        </header>

        <!-- 메인 레이아웃 -->
        <div class="admin-setting-layout">
            <!-- 좌측 프리뷰 영역 (배경 미디어 + 모든 꽃 렌더링 & 드래그) -->
            <div class="admin-preview-viewport fallback-gradient-bg" id="admin-preview-viewport">
                <!-- 배경 미디어 컨테이너 -->
                <div id="admin-preview-bg" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;">
                </div>

                <!-- 해당 씬의 모든 꽃들이 렌더링될 편집 레이어 -->
                <div id="admin-flowers-editable-layer"
                    style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;"></div>
            </div>

            <!-- 우측 설정 컨트롤 패널 -->
            <div class="admin-setting-sidebar">
                <!-- 1. 배경 미디어 교체 -->
                <div>
                    <div class="toolbar-group-title">배경 이미지</div>
                    <div style="display: flex; gap: 8px;">
                        <input type="file" id="bg-file-input" accept="image/*,video/*" style="display: none;">
                        <button class="btn" id="btn-select-bg" style="flex: 1;">📂 미디어 파일 선택</button>
                        <button class="btn btn-danger" id="btn-reset-bg" title="배경 제거">🗑️</button>
                    </div>
                </div>

                <hr style="border-color: var(--border-color); opacity: 0.3;">

                <!-- 2. 선택된 꽃 속성 편집 및 삭제 패널 -->
                <div>
                    <div class="toolbar-group-title">🌸 선택된 꽃 속성 편집</div>
                    <div id="flower-editor-panel" style="opacity: 0.5; pointer-events: none;">
                        <p id="no-flower-selected-msg"
                            style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                            좌측 프리뷰에서 수정할 꽃을 클릭해 선택해 주세요.
                        </p>

                        <div style="margin-bottom: 16px;">
                            <label class="form-label" style="font-size: 0.85rem;">소유자 / 대상 이름</label>
                            <input type="text" id="edit-flower-owner" class="form-input" placeholder="이름 입력">
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label class="form-label" style="font-size: 0.85rem;">이름표 앵커 (9가지)</label>
                            <div class="anchor-grid-3x3">
                                <div class="anchor-cell" data-anchor="top-left">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="top">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="top-right">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="left">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="center">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="right">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="bottom-left">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="bottom">
                                    <div class="anchor-dot"></div>
                                </div>
                                <div class="anchor-cell" data-anchor="bottom-right">
                                    <div class="anchor-dot"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 선택한 꽃 삭제 버튼 (★ 필수) -->
                        <button class="btn btn-danger" id="btn-delete-selected-flower" style="width: 100%;">
                            🗑️ 선택한 꽃 삭제
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 꽃 삭제 승인 확인 모달 -->
        <div class="modal-overlay" id="delete-flower-modal">
            <div class="modal-card">
                <h3 class="modal-title" style="color: var(--danger);">🗑️ 꽃 삭제 확인</h3>
                <p class="modal-desc">정말 선택하신 꽃을 삭제하시겠습니까?<br>삭제 후에는 복구할 수 없습니다.</p>
                <div class="modal-actions">
                    <button class="btn" id="btn-cancel-flower-delete">취소</button>
                    <button class="btn btn-danger" id="btn-confirm-flower-delete">삭제 실행</button>
                </div>
            </div>
        </div>

        <!-- 게시 (Publish) 승인 확인 모달 -->
        <div class="modal-overlay" id="publish-modal">
            <div class="modal-card">
                <h3 class="modal-title">🚀 정원 게시 (Publish)</h3>
                <p class="modal-desc">
                    배경 미디어 교체 및 꽃 위치/속성/삭제 변경 사항을<br>프로젝터 화면 및 참가자 아이패드에 최종 반영하시겠습니까?
                </p>
                <div class="modal-actions">
                    <button class="btn" id="btn-cancel-publish">취소</button>
                    <button class="btn btn-primary" id="btn-confirm-publish">게시 실행 ✨</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/public/admin/setting.js"></script>
</body>

</html>
